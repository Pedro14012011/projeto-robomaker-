<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
</head>
<body>
    <h1>Crie sua Conta</h1>
    <nav>
    <ul>
        <li>
            <a href="index.html">Para vou na pagina inicial</a>
        </li>
    </ul>
    </nav>
    <div>
        <h2>Cadastro de Aluno</h2>

    <form>
        <p>
            Nome Completo:<br>
            <input type="text">
        </p>

        <p>
            E-mail:<br>
            <input type="email">
        </p>

        <p>
            Senha:<br>
            <input type="password">
        </p>

        <p>
            Perfil de Aluno:<br>
            <input type="radio" name="perfil"> Estudante
            <input type="radio" name="perfil"> Professor/Hobbista
        </p>

        <p>
            Trilha de Interesse:<br>
            <select>
                <option>Robótica Básica</option>
                <option>Inteligência Artificial</option>
                <option>Programação</option>
            </select>
        </p>

        <button type="submit">Enviar</button>
    </form>
     </div>
</body>
</html>
